version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ast_xgb_backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - PORT=8000
      - LOG_LEVEL=INFO
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ast_xgb_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
